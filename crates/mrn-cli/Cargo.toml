[package]
name = "mrn-cli"
description = "mrn: a FileBot-style media renamer for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mrn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
comfy-table = "8.0.1"
console = "0.16.6"
dialoguer = "0.12.0"
indicatif = "0.18.6"
mrn-core = { path = "../mrn-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
